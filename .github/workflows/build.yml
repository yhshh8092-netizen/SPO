name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Show repo contents (debug)
        run: find . -maxdepth 3 -not -path '*/.git*'

      - name: Unzip anything that's still zipped
        run: |
          shopt -s nullglob
          for z in *.zip **/*.zip; do
            echo "Unzipping $z"
            unzip -o "$z" -d .
          done

      - name: Stash your app code
        run: |
          LIB_DIR=$(find . -type d -name lib -not -path '*/.git*' | head -n 1)
          if [ -z "$LIB_DIR" ]; then
            echo "::error::No 'lib' folder found anywhere in the repo. Check the 'Show repo contents' step above to see what was actually uploaded."
            exit 1
          fi
          echo "Found lib at: $LIB_DIR"
          mkdir -p /tmp/app_src
          cp -r "$LIB_DIR" /tmp/app_src/

      - name: Scaffold a fresh Flutter project (generates pubspec.yaml, android/, etc.)
        run: flutter create --org com.vrcportal --project-name vrchat_mobile_app .

      - name: Drop your app code back in
        run: |
          rm -rf lib
          cp -r /tmp/app_src/lib .

      - name: Add the packages the app needs
        run: |
          flutter pub add provider dio flutter_staggered_animations cached_network_image
          flutter pub add "vrchat_dart:^3.5.3"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vrchat-mobile-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14
